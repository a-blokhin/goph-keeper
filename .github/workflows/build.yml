name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.21"]
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Build Server
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -o bin/server-${{ matrix.os }}-${{ matrix.arch }}.exe ./cmd/server
          else
            GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -o bin/server-${{ matrix.os }}-${{ matrix.arch }} ./cmd/server
          fi
        shell: bash

      - name: Build Client
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -o goph_keeper-${{ matrix.os }}-${{ matrix.arch }}.exe ./cmd/client
          else
            GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -o goph_keeper-${{ matrix.os }}-${{ matrix.arch }} ./cmd/client
          fi
        shell: bash

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race ./internal/...

      - name: Run E2E tests
        run: go test -v ./tests/e2e/...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.55.2
          args: --out-format=colored-line-number
